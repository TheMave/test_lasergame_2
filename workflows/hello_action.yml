on: push
jobs:
  hello_action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hello Action
        uses: ./
        with:
          who-to-greet: 'Mona the Octocat'
      - name: Check the output
        run: echo "The action greeted ${{ steps.hello_action.outputs.time }}"